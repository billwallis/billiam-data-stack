# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[project]
name = "billiam-data-stack"
version = "0.0.0"
description = "Analytical data stack for life admin."
authors = [{name = "billwallis"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dlt[motherduck]>=1.23.0",
    "duckdb<1.5.0",  # capped by MotherDuck
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "sqlmesh>=0.232.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "pre-commit>=4.5.1",
]


[tool.uv]
required-version = ">=0.8"
default-groups = "all"
package = false

[tool.uv.build-backend]
namespace = true


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    uv sync --refresh
    uv run pre-commit install --install-hooks
"""
upgrade.shell = """
    uv sync --refresh --upgrade
    uv run pre-commit autoupdate
"""
docker-up = "docker-compose --file docker-compose.yaml --project-name billiam-data-stack up --detach"
docker-down = "docker-compose --file docker-compose.yaml --project-name billiam-data-stack down --remove-orphans"

# SQLMesh wrappers (`cmd` rather than `shell` for colour output)
run = [
    {cmd = "uv run -m src.ingestion"},
    {cmd = "sqlmesh -p src/transformation run dev"},
    {cmd = "sqlmesh -p src/transformation run prod"},
]
clean = [
    {cmd = "sqlmesh -p src/transformation clean"},
    {cmd = "sqlmesh -p src/transformation janitor"},
]
debug = [
    {cmd = "sqlmesh -p src/transformation info"},
    {cmd = "sqlmesh -p src/transformation check_intervals"},
]

render = "sqlmesh -p src/transformation render"
test = "sqlmesh -p src/transformation test -vv"

migrate = "sqlmesh -p src/transformation migrate"
plan = "sqlmesh -p src/transformation plan"
audit = "sqlmesh -p src/transformation audit"

sqlmesh = "sqlmesh -p src/transformation"

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity uv run pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity uv run pre-commit run --all-files --hook-stage pre-push
    echo '=== sqlmesh checks ==='
    sqlmesh -p src/transformation lint
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity uv run pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity uv run pre-commit run --all-files --hook-stage pre-push
    echo '\\033[0;34msqlmesh checks\\033[0m'
    sqlmesh -p src/transformation lint
"""


[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations
    "B",     # flake8-bugbear
    "E",     # pycodestyle-error
    "F",     # Pyflakes
    "FURB",  # refurb
    "I",     # isort
    "N",     # pep8-naming
    "PL",    # Pylint
    "PERF",  # Perflint
    "RUF",   # Ruff-specific
    "S",     # flake8-bandit
    "UP",    # pyupgrade
    "W",     # pycodestyle-warning
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "E501",    # Line too long
]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# https://github.com/astral-sh/ruff/issues/4368
[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation for public function
    "S101",     # Use of `assert` detected
    "PLR2004",  # Magic value used in comparison
    "PLR0913",  # Too many arguments in function definition
]
