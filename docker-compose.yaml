# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
---
services:
  metaduck:
    build:
      context: .
      dockerfile: dockerfiles/metaduck.Dockerfile
    container_name: Metaduck
    hostname: metaduck
    volumes:
      - type: bind
        source: ./dockerfiles/metaduck-data
        target: /metabase-data/
    ports: ["3000:3000"] # http://localhost:3000/
    environment:
      MB_DB_FILE: metabase-data/metabase.db
